name: Build & Release

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'

  # Allow manual trigger with a custom tag name
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g., v1.0.0)'
        required: true
        type: string

# Ensure only one release workflow runs at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # iOS Build (macOS runner with Xcode + Rust)
  # ─────────────────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy app icon to iOS Assets
        run: |
          rm -f ios/SoloBandUltra/SoloBandUltra/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png
          cp icon/app-icon-1024.png ios/SoloBandUltra/SoloBandUltra/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png
          rm -f ios/SoloBandUltra/SoloBandUltra/Assets.xcassets/AppIconImage.imageset/app-icon-1024.png
          cp icon/app-icon-1024.png ios/SoloBandUltra/SoloBandUltra/Assets.xcassets/AppIconImage.imageset/app-icon-1024.png

      - name: Copy fonts to iOS bundle
        run: |
          mkdir -p ios/SoloBandUltra/SoloBandUltra/Fonts
          cp assets/fonts/*.ttf ios/SoloBandUltra/SoloBandUltra/Fonts/ 2>/dev/null || true
          cp assets/fonts/*.otf ios/SoloBandUltra/SoloBandUltra/Fonts/ 2>/dev/null || true
          cp assets/fonts/*.ttc ios/SoloBandUltra/SoloBandUltra/Fonts/ 2>/dev/null || true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-ios

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ios-cargo-${{ hashFiles('rust/Cargo.toml', 'rust/scorelib/Cargo.toml') }}
          restore-keys: ios-cargo-

      - name: Build Rust scorelib (iOS Device + Simulator)
        working-directory: rust/scorelib
        run: |
          cp Cargo.toml Cargo.toml.orig
          sed -i '' 's/crate-type = .*/crate-type = ["lib", "staticlib"]/' Cargo.toml
          trap "mv Cargo.toml.orig Cargo.toml 2>/dev/null || true" EXIT

          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios

      - name: Create XCFrameworks
        run: |
          # Workspace target dir (both crates build here)
          RUST_TARGET=rust/target
          LIB_DIR=ios/SoloBandUltra/lib
          mkdir -p "$LIB_DIR"

          # --- libscorelib.xcframework ---
          INCLUDE_SCORE=ios/SoloBandUltra/include
          SIM_FAT_SCORE="${RUST_TARGET}/libscorelib-sim.a"
          lipo -create \
            "${RUST_TARGET}/aarch64-apple-ios-sim/release/libscorelib.a" \
            "${RUST_TARGET}/x86_64-apple-ios/release/libscorelib.a" \
            -output "$SIM_FAT_SCORE"

          rm -rf "$LIB_DIR/libscorelib.xcframework"
          xcodebuild -create-xcframework \
            -library "${RUST_TARGET}/aarch64-apple-ios/release/libscorelib.a" \
            -headers "$INCLUDE_SCORE" \
            -library "$SIM_FAT_SCORE" \
            -headers "$INCLUDE_SCORE" \
            -output "$LIB_DIR/libscorelib.xcframework"
          rm -f "$SIM_FAT_SCORE"

      - name: Resolve Swift Package dependencies
        working-directory: ios/SoloBandUltra
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SoloBandUltra.xcodeproj \
            -scheme SoloBandUltra

      - name: Build iOS app (Release, Simulator)
        working-directory: ios/SoloBandUltra
        run: |
          xcodebuild \
            -project SoloBandUltra.xcodeproj \
            -scheme SoloBandUltra \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app
        working-directory: ios/SoloBandUltra
        run: |
          cd DerivedData/Build/Products/Release-iphonesimulator
          # Zip the .app bundle for distribution
          ditto -c -k --sequesterRsrc --keepParent SoloBandUltra.app \
            SoloBandUltra-iOS-Simulator.zip
          mv SoloBandUltra-iOS-Simulator.zip "$GITHUB_WORKSPACE/"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: SoloBandUltra-iOS-Simulator.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Android Build (Ubuntu runner with Gradle + Rust)
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick (for app icon generation)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: android-cargo-${{ hashFiles('rust/Cargo.toml', 'rust/scorelib/Cargo.toml') }}
          restore-keys: android-cargo-

      - name: Build Rust scorelib (Android)
        working-directory: rust/scorelib
        run: |
          NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          NDK_BIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_BIN}/aarch64-linux-android21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${NDK_BIN}/x86_64-linux-android21-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-z -C link-arg=max-page-size=16384"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-z -C link-arg=max-page-size=16384"

          cargo build --release --target aarch64-linux-android
          cargo build --release --target x86_64-linux-android

      - name: Copy .so files to jniLibs
        run: |
          RUST_TARGET=rust/target
          JNI=android/app/src/main/jniLibs
          mkdir -p "$JNI/arm64-v8a" "$JNI/x86_64"

          cp "$RUST_TARGET/aarch64-linux-android/release/libscorelib.so" "$JNI/arm64-v8a/"
          cp "$RUST_TARGET/x86_64-linux-android/release/libscorelib.so" "$JNI/x86_64/"

      - name: Copy fonts to Android assets
        run: |
          mkdir -p android/app/src/main/assets/fonts
          cp assets/fonts/*.ttf android/app/src/main/assets/fonts/ 2>/dev/null || true
          cp assets/fonts/*.otf android/app/src/main/assets/fonts/ 2>/dev/null || true
          cp assets/fonts/*.ttc android/app/src/main/assets/fonts/ 2>/dev/null || true
          mkdir -p android/app/src/main/res/font
          cp assets/fonts/NotoSansCJK-Regular.ttc android/app/src/main/res/font/noto_sans_cjk_regular.ttc 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper

      - name: Setup Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Decode the release keystore from the base64-encoded secret
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          ls -lh android/release.keystore

      - name: Build Android release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build Android release AAB (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Clean up keystore
        if: always()
        run: rm -f android/release.keystore

      - name: Rename build outputs
        run: |
          # Signed release APK — installable on any Android device
          cp android/app/build/outputs/apk/release/app-release.apk \
            SoloBandUltra-Android-release.apk

          # Signed release AAB — for Google Play upload
          cp android/app/build/outputs/bundle/release/app-release.aab \
            SoloBandUltra-Android-release.aab

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-build
          path: SoloBandUltra-Android-release.apk
          if-no-files-found: error

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-build
          path: SoloBandUltra-Android-release.aab
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # Run Rust tests + code coverage
  # ─────────────────────────────────────────────
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/scorelib/target
          key: test-cargo-${{ hashFiles('rust/scorelib/Cargo.toml', 'rust/scorelib/Cargo.lock') }}
          restore-keys: test-cargo-

      - name: Run tests with coverage
        working-directory: rust/scorelib
        run: cargo llvm-cov --no-clean -- --nocapture

      - name: Generate coverage report (summary)
        working-directory: rust/scorelib
        run: |
          echo "## Rust Code Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --skip-functions 2>&1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # Create GitHub Release with all build artifacts
  # ─────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-ios, build-android, test-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh ./artifacts/

      - name: Determine release tag
        id: tag
        # Use environment variables instead of inline ${{ }} interpolation
        # to prevent script injection from workflow_dispatch inputs.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SoloBand Ultra ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## SoloBand Ultra ${{ steps.tag.outputs.tag }}

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | iOS | `SoloBandUltra-iOS-Simulator.zip` | iOS Simulator build (unsigned) |
            | Android | `SoloBandUltra-Android-release.apk` | Signed release APK — install directly on device |
            | Android | `SoloBandUltra-Android-release.aab` | Signed release AAB — for Google Play upload |

            ### Installation

            **iOS Simulator:**
            1. Unzip `SoloBandUltra-iOS-Simulator.zip`
            2. Drag `SoloBandUltra.app` onto an open iOS Simulator window
               — or install via CLI: `xcrun simctl install booted SoloBandUltra.app`

            **Android:**
            1. Download `SoloBandUltra-Android-release.apk` to your device
            2. Open the file and allow installation from unknown sources when prompted

            > **Note:** The iOS build is for Simulator only. A signed IPA for physical devices requires Apple Developer certificates configured in the workflow.
          files: |
            ./artifacts/SoloBandUltra-iOS-Simulator.zip
            ./artifacts/SoloBandUltra-Android-release.apk
            ./artifacts/SoloBandUltra-Android-release.aab
          draft: false
          prerelease: false

      ###- name: Upload to Google Drive
